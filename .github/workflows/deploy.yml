name: Update Data & Deploy to GitHub Pages

on:
  schedule:
    # 台灣時間週一至週五 16:30、17:00、17:30 執行（UTC 08:30, 09:00, 09:30）
    # 多重排程確保避開 GitHub 隊列延遲，並在交易所結算發布後第一時間更新
    - cron: '30 8 * * 1-5'
    - cron: '0 9 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Institutional Flow Pipeline
        run: |
          python -m pipeline.run

      - name: Run Test Suite
        run: |
          pytest

      - name: Commit & Push Data Updates (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(data): auto-update institutional flow data [skip ci]"
            git pull --rebase origin main || true
            git push || true
          else
            echo "No data changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
